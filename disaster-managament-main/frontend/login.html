<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeevan Setu - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    .demo-box {
      background: #f8f9fa;
      border-radius: 12px;
      font-size: 0.85rem;
      max-height: 320px;
      overflow-y: auto;
    }
    .demo-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }
    #serverAlert { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-6">
        <div class="login-card p-4 p-md-5">
          <div class="text-center mb-4">
            <h1 class="h2 text-primary fw-bold">Jeevan Setu</h1>
            <p class="text-muted mb-0">Emergency Response System</p>
          </div>

          <div id="serverAlert" class="alert alert-warning mb-3"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control form-control-lg" id="email"
                     placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control form-control-lg" id="password"
                     placeholder="Enter password" autocomplete="current-password" required>
            </div>
            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                <span id="loginSpinner" class="spinner-border spinner-border-sm d-none me-2"></span>
                Log In
              </button>
            </div>
          </form>

          <div class="demo-box p-3 mb-3">
            <strong>Quick demo login</strong> — password for all: <code>pass1234</code>

            <p class="demo-section-title text-warning mt-3 mb-1">Victims (5)</p>
            <div class="d-grid gap-1 mb-2">
              <button type="button" class="btn btn-outline-warning btn-sm demo-login" data-email="victim1@test.com">Victim 1 — victim1@test.com</button>
              <button type="button" class="btn btn-outline-warning btn-sm demo-login" data-email="victim2@test.com">Victim 2 — victim2@test.com</button>
              <button type="button" class="btn btn-outline-warning btn-sm demo-login" data-email="victim3@test.com">Victim 3 — victim3@test.com</button>
              <button type="button" class="btn btn-outline-warning btn-sm demo-login" data-email="victim4@test.com">Victim 4 — victim4@test.com</button>
              <button type="button" class="btn btn-outline-warning btn-sm demo-login" data-email="victim5@test.com">Victim 5 — victim5@test.com</button>
            </div>

            <p class="demo-section-title text-success mb-1">Volunteers (5)</p>
            <div class="d-grid gap-1 mb-2">
              <button type="button" class="btn btn-outline-success btn-sm demo-login" data-email="volunteer1@test.com">Volunteer 1 — volunteer1@test.com</button>
              <button type="button" class="btn btn-outline-success btn-sm demo-login" data-email="volunteer2@test.com">Volunteer 2 — volunteer2@test.com</button>
              <button type="button" class="btn btn-outline-success btn-sm demo-login" data-email="volunteer3@test.com">Volunteer 3 — volunteer3@test.com</button>
              <button type="button" class="btn btn-outline-success btn-sm demo-login" data-email="volunteer4@test.com">Volunteer 4 — volunteer4@test.com</button>
              <button type="button" class="btn btn-outline-success btn-sm demo-login" data-email="volunteer5@test.com">Volunteer 5 — volunteer5@test.com</button>
            </div>

            <p class="demo-section-title text-danger mb-1">Admins (2)</p>
            <div class="d-grid gap-1">
              <button type="button" class="btn btn-outline-danger btn-sm demo-login" data-email="admin1@test.com">Admin 1 — admin1@test.com</button>
              <button type="button" class="btn btn-outline-danger btn-sm demo-login" data-email="admin2@test.com">Admin 2 — admin2@test.com</button>
            </div>
          </div>

          <div class="d-grid gap-2 mb-3">
            <a href="victim.html?guest=1" class="btn btn-danger btn-lg">Emergency — Continue Without Login</a>
          </div>

          <div class="text-center">
            <small class="text-muted">New here? <a href="signup.html">Create an account</a></small>
            <br>
            <small class="text-muted"><a href="track.html">Track request by ID</a></small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js?v=5"></script>
  <script>
    function saveUserSession(userData) {
      sessionStorage.setItem('user', JSON.stringify({
        ...userData,
        loginTime: new Date().toISOString()
      }));
    }

    function redirectToDashboard(role) {
      if (role === 'victim') window.location.href = 'victim.html';
      else if (role === 'volunteer') window.location.href = 'volunteer.html';
      else if (role === 'admin') window.location.href = 'admin.html';
    }

    async function doLogin(email, password) {
      const loginBtn = document.getElementById('loginBtn');
      const spinner = document.getElementById('loginSpinner');

      loginBtn.disabled = true;
      spinner.classList.remove('d-none');

      try {
        const response = await api.login({ email, password });

        if (response.success && response.token) {
          saveUserSession({
            token: response.token,
            role: response.data.role,
            name: response.data.name,
            email: response.data.email
          });
          redirectToDashboard(response.data.role);
        } else {
          showNotification(response.message || 'Login failed.', 'danger');
        }
      } catch (error) {
        showNotification(error.message || 'Login failed. Run npm run dev first.', 'danger');
      } finally {
        loginBtn.disabled = false;
        spinner.classList.add('d-none');
      }
    }

    document.querySelectorAll('.demo-login').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('email').value = btn.dataset.email;
        document.getElementById('password').value = 'pass1234';
        doLogin(btn.dataset.email, 'pass1234');
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      doLogin(email, password);
    });

    async function showServerStatus() {
      const alertEl = document.getElementById('serverAlert');
      const health = await checkServerHealth();
      if (!health.ok) {
        alertEl.style.display = 'block';
        alertEl.innerHTML = `<strong>Server offline.</strong> ${health.message}
          <button type="button" class="btn btn-sm btn-warning ms-2" onclick="showServerStatus()">Retry</button>`;
      } else {
        alertEl.style.display = 'none';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      sessionStorage.removeItem('user');
      showServerStatus();
    });
  </script>
</body>
</html>
