<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Request - Jeevan Setu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Jeevan Setu</a>
      <a href="login.html" class="btn btn-outline-light btn-sm">Log In</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="h4 mb-1">Track Emergency Request</h2>
            <p class="text-muted small mb-4">Enter your Request ID to check live status — no login required.</p>

            <form id="trackForm" class="mb-4">
              <label class="form-label">Request ID</label>
              <div class="input-group">
                <input type="text" id="requestIdInput" class="form-control" placeholder="Paste request ID here" required>
                <button type="submit" class="btn btn-primary">Track</button>
              </div>
            </form>

            <div id="trackResult" style="display:none;">
              <div class="alert alert-info py-2 small" id="trackStatusBanner"></div>
              <dl class="row mb-0 small">
                <dt class="col-sm-4">Type</dt><dd class="col-sm-8" id="trType">—</dd>
                <dt class="col-sm-4">Priority</dt><dd class="col-sm-8" id="trPriority">—</dd>
                <dt class="col-sm-4">Status</dt><dd class="col-sm-8" id="trStatus">—</dd>
                <dt class="col-sm-4">Location</dt><dd class="col-sm-8" id="trLocation">—</dd>
                <dt class="col-sm-4">Description</dt><dd class="col-sm-8" id="trDescription">—</dd>
                <dt class="col-sm-4">Submitted</dt><dd class="col-sm-8" id="trSubmitted">—</dd>
                <dt class="col-sm-4">Volunteer</dt><dd class="col-sm-8" id="trVolunteer">—</dd>
              </dl>
            </div>

            <div id="trackError" class="alert alert-danger" style="display:none;"></div>
          </div>
        </div>

        <div class="text-center mt-3">
          <a href="victim.html?guest=1" class="text-danger">Submit new emergency request</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=5"></script>
  <script>
    async function trackRequest(id) {
      const resultEl = document.getElementById('trackResult');
      const errorEl = document.getElementById('trackError');
      resultEl.style.display = 'none';
      errorEl.style.display = 'none';

      try {
        const res = await fetch(`${window.API_BASE_URL}/requests/${encodeURIComponent(id)}`);
        const data = await res.json();

        if (!data.success || !data.data) {
          throw new Error(data.message || 'Request not found');
        }

        const r = data.data;
        const status = r.status || 'pending';
        const statusMessages = {
          pending: '⏳ Waiting for a volunteer to accept your request.',
          assigned: '✅ A volunteer has been assigned and will contact you soon.',
          in_progress: '🚑 Help is on the way.',
          completed: '🎉 Your request has been completed.',
          cancelled: '❌ This request was cancelled.'
        };

        document.getElementById('trackStatusBanner').textContent = statusMessages[status] || status;
        document.getElementById('trType').textContent = r.type || '—';
        document.getElementById('trPriority').textContent = (r.priority || 'medium').toUpperCase();
        document.getElementById('trStatus').innerHTML = `<span class="badge bg-primary">${status.toUpperCase()}</span>`;
        document.getElementById('trLocation').textContent = r.address || '—';
        document.getElementById('trDescription').textContent = r.description || '—';
        document.getElementById('trSubmitted').textContent = r.createdAt ? new Date(r.createdAt).toLocaleString() : '—';
        document.getElementById('trVolunteer').textContent = r.assignedVolunteer?.name || 'Not assigned yet';

        resultEl.style.display = 'block';
      } catch (err) {
        errorEl.textContent = err.message || 'Could not find this request. Check the ID and try again.';
        errorEl.style.display = 'block';
      }
    }

    document.getElementById('trackForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('requestIdInput').value.trim();
      if (id) trackRequest(id);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (id) {
        document.getElementById('requestIdInput').value = id;
        trackRequest(id);
      }
    });
  </script>
</body>
</html>
