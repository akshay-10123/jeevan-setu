<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeevan Setu - Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; min-height: 100vh; display: flex; align-items: center; }
    .card { border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    #serverAlert { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="mb-1">Create your account</h2>
            <p class="text-muted">Join Jeevan Setu to request or offer help</p>
          </div>

          <div id="serverAlert" class="alert alert-warning mb-3"></div>

          <form id="signupForm">
            <div class="mb-3">
              <label class="form-label">Full name</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" minlength="6" required>
              <small class="text-muted">Minimum 6 characters</small>
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label>
              <select name="role" class="form-select" required>
                <option value="victim">Victim — I need help</option>
                <option value="volunteer">Volunteer — I want to help</option>
                <option value="admin">Admin — Manage system</option>
              </select>
            </div>

            <div class="d-grid gap-2 mb-3">
              <button type="submit" class="btn btn-primary btn-lg" id="signupBtn">Create Account</button>
            </div>
          </form>

          <div class="d-grid mb-3">
            <a href="victim.html?guest=1" class="btn btn-outline-danger">Emergency — Continue Without Login</a>
          </div>

          <div class="text-center">
            <small class="text-muted">Already have an account? <a href="login.html">Log in</a></small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js?v=5"></script>
  <script>
    function saveUserSession(userData) {
      sessionStorage.setItem('user', JSON.stringify({
        ...userData,
        loginTime: new Date().toISOString()
      }));
    }

    function redirectToDashboard(role) {
      if (role === 'victim') window.location.href = 'victim.html';
      else if (role === 'volunteer') window.location.href = 'volunteer.html';
      else if (role === 'admin') window.location.href = 'admin.html';
      else showNotification('Invalid role', 'danger');
    }

    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const form = e.target;
      const submitBtn = document.getElementById('signupBtn');
      const payload = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        password: form.password.value,
        role: form.role.value
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const res = await api.signup(payload);

        if (res.success && res.token) {
          saveUserSession({
            token: res.token,
            role: res.data.role,
            name: res.data.name,
            email: res.data.email
          });
          showNotification('Account created successfully!', 'success');
          redirectToDashboard(res.data.role);
        } else {
          showNotification(res.message || 'Signup failed', 'danger');
        }
      } catch (err) {
        showNotification(err.message || 'Signup failed.', 'danger');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });

    async function showServerStatus() {
      const alertEl = document.getElementById('serverAlert');
      const health = await checkServerHealth();
      if (!health.ok) {
        alertEl.style.display = 'block';
        alertEl.innerHTML = `<strong>Server offline.</strong> ${health.message}
          <button type="button" class="btn btn-sm btn-warning ms-2" onclick="showServerStatus()">Retry</button>`;
      } else {
        alertEl.style.display = 'none';
      }
    }

    window.addEventListener('DOMContentLoaded', showServerStatus);
  </script>
</body>
</html>
