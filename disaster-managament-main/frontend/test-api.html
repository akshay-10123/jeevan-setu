<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - Jeevan Setu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>API Connection Test</h1>
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Backend Health Check</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary" onclick="testHealth()">Test Health</button>
                        <div id="healthResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Request Creation</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-success" onclick="testRequest()">Test Request</button>
                        <div id="requestResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>All Requests</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-info" onclick="getAllRequests()">Get All Requests</button>
                        <div id="allRequestsResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function testHealth() {
            const resultDiv = document.getElementById('healthResult');
            resultDiv.innerHTML = '<div class="spinner-border spinner-border-sm" role="status"></div> Testing...';
            
            try {
                const response = await fetch('http://localhost:5000/health');
                const data = await response.json();
                resultDiv.innerHTML = `
                    <div class="alert alert-success">
                        <strong>✅ Backend is running!</strong><br>
                        Status: ${data.status}<br>
                        Uptime: ${Math.round(data.uptime)}s
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>❌ Backend is not running!</strong><br>
                        Error: ${error.message}<br>
                        <small>Make sure to run: npm start</small>
                    </div>
                `;
            }
        }

        async function testRequest() {
            const resultDiv = document.getElementById('requestResult');
            resultDiv.innerHTML = '<div class="spinner-border spinner-border-sm" role="status"></div> Creating test request...';
            
            try {
                const testData = {
                    type: 'medical',
                    location: 'Mumbai, Maharashtra',
                    description: 'Test emergency request',
                    contact: '+91-9876543210',
                    name: 'Test User',
                    priority: 'high'
                };

                const response = await fetch('http://localhost:5000/api/requests', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });

                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <strong>✅ Request created successfully!</strong><br>
                            ID: ${data.data.id}<br>
                            Status: ${data.data.status}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-warning">
                            <strong>⚠️ Request failed!</strong><br>
                            Message: ${data.message}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>❌ Error creating request!</strong><br>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        async function getAllRequests() {
            const resultDiv = document.getElementById('allRequestsResult');
            resultDiv.innerHTML = '<div class="spinner-border spinner-border-sm" role="status"></div> Fetching requests...';
            
            try {
                const response = await fetch('http://localhost:5000/api/requests');
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-info">
                            <strong>📋 Found ${data.count} requests</strong><br>
                            <pre>${JSON.stringify(data.data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-warning">
                            <strong>⚠️ Failed to fetch requests!</strong><br>
                            Message: ${data.message}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>❌ Error fetching requests!</strong><br>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Auto-test on page load
        window.addEventListener('load', function() {
            testHealth();
        });
    </script>
</body>
</html>
